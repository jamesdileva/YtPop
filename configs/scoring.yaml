# S6 clip scoring — weights + lexicons. Tunable without code changes.
# Final score = weighted sum of positives minus weighted penalties,
# normalized to ~0..100. Selection uses MMR over final_score (see
# app/domain/clipping/service.py).

windows:
  min_duration: 5.0
  max_duration: 90.0
  target_candidates_per_video: 10
  # max consecutive transcript segments merged into one window
  max_segments_per_window: 8
  # D1: drop near-duplicate time windows from top-k (threshold relaxes
  # progressively rather than starving the review queue)
  non_overlap: true
  max_overlap: 0.5

weights:
  hook: 20.0
  relevance: 15.0
  novelty: 10.0
  emotion: 15.0
  payoff: 10.0
  completeness: 5.0
  semantic_relevance: 15.0
  semantic_novelty: 10.0
  redundancy: 25.0
  dead_air: 15.0
  context_dependency: 10.0

# substring lexicons (lowercased match)
hook_words:
  - "what if"
  - "how to"
  - "why"
  - "never"
  - "always"
  - "secret"
  - "warning"
  - "breaking"
  - "watch"
  - "look at this"

emotion_words:
  - "wow"
  - "amazing"
  - "insane"
  - "incredible"
  - "hilarious"
  - "shocking"
  - "unbelievable"
  - "crazy"
  - "epic"
  - "no way"

payoff_words:
  - "best"
  - "first"
  - "world record"
  - "winner"
  - "finally"
  - "result"
  - "answer"
  - "reveal"

# sentence starts that usually need outside context (penalized)
dangling_starts:
  - "it "
  - "this "
  - "that "
  - "they "
  - "he "
  - "she "
  - "and then"

# words-per-second below this counts as dead air
min_wps: 1.2

# S14 scoring evolution — all default off (V1/V2 path unchanged).
scoring_version: v2

# V4 cheap vision (luma motion on finalist windows only)
vision:
  enabled: false
  fps: 1
  weight: 10.0
  finalist_multiplier: 3

# V3 LLM judge ("is this actually interesting?", finalists only)
llm_scoring:
  enabled: false
  weight: 10.0

# V5 learned ranker (produced by: python -m app.domain.clipping.training
# --out data/models/ranker.json ; disabled until a good weights file exists)
learned_ranking:
  enabled: false
  path: data/models/ranker.json
