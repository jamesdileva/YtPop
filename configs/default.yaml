discovery:
  regions: [US]
  categories: [gaming, entertainment, technology]
  scan_interval_minutes: 30
clipping:
  min_duration: 4
  max_duration: 90
  target_candidates_per_video: 10
episodes:
  target_duration_minutes: 20
  max_sources: 30
render:
  resolution: 1920x1080
  fps: 30
workers:
  transcription: 1
  vision: 1
  editorial: 1
  render: 1
models:
  classifier: qwen3:4b
  summarizer: qwen3:4b
  editor: qwen3.5:9b
  vision: qwen2.5vl:3b
ollama:
  host: http://127.0.0.1:11434
  timeout_seconds: 300
  num_predict: 2000
  temperature: 0.0
trends:
  similarity_threshold: 0.55
  min_sources: 2
  # component weights (must sum to 1.0)
  weights:
    views_velocity: 0.25
    engagement_velocity: 0.15
    recency: 0.15
    cross_source: 0.20
    momentum: 0.15
    novelty: 0.10
  # normalization caps (component hits 100 at cap)
  views_velocity_cap: 10000.0
  engagement_velocity_cap: 1000.0
  cross_source_cap: 5
  recency_half_life_hours: 24.0
