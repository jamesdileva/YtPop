[project]
name = "ytpop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "structlog>=24.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
